services:
    postgres:
        image: postgres:16-alpine
        container_name: jobtracker-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: jobtracker
        ports:
            - "5432:5432"
        volumes:
            - jobtracker_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    jobtracker_data: